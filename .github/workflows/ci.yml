name: CI

on:
  push:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docbook/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docbook/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-private-tests:
    name: QEMU Private Tests (macOS, armv7m -> armv6m)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 80
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve RK0 repository root
        run: |
          set -euo pipefail
          WORKSPACE="${GITHUB_WORKSPACE:-$PWD}"
          RK0_ROOT="$(git -C "${WORKSPACE}" rev-parse --show-toplevel)"
          if [[ ! -f "${RK0_ROOT}/Makefile" ]]; then
            echo "::error::Resolved RK0 root has no Makefile: ${RK0_ROOT}"
            exit 1
          fi
          echo "RK0_ROOT=${RK0_ROOT}" >> "${GITHUB_ENV}"
          echo "RK0 root: ${RK0_ROOT}"

      - name: Validate runner toolchain
        run: |
          set -euo pipefail
          command -v qemu-system-arm
          command -v arm-none-eabi-gcc
          command -v cppcheck

      - name: Run Cppcheck
        run: |
          set -euo pipefail
          make -C "${RK0_ROOT}" cppcheck

      - name: Link private tests/qemu into workspace
        env:
          PRIVATE_QEMU_HARNESS_DIR: ${{ vars.PRIVATE_QEMU_HARNESS_DIR }}
          PRIVATE_QEMU_TESTS_DIR: ${{ vars.PRIVATE_QEMU_TESTS_DIR }}
        run: |
          set -euo pipefail
          HARNESS_SRC_RAW="${PRIVATE_QEMU_HARNESS_DIR:-${PRIVATE_QEMU_TESTS_DIR:-/Users/antonio/private-rk0-harness/qemu}}"
          HARNESS_SRC="${HARNESS_SRC_RAW#PRIVATE_QEMU_HARNESS_DIR=}"
          HARNESS_SRC="${HARNESS_SRC#PRIVATE_QEMU_TESTS_DIR=}"
          HARNESS_SRC="$(printf '%s' "${HARNESS_SRC}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [[ ! -d "${HARNESS_SRC}" ]]; then
            echo "::error::Private harness path not found: ${HARNESS_SRC}"
            echo "Set repo variable PRIVATE_QEMU_HARNESS_DIR (or PRIVATE_QEMU_TESTS_DIR) to your local private qemu directory on the runner host."
            exit 1
          fi

          if [[ ! -x "${HARNESS_SRC}/scripts/qemu/run_unit_tests.sh" ]]; then
            echo "::error::Missing executable script: ${HARNESS_SRC}/scripts/qemu/run_unit_tests.sh"
            exit 1
          fi

          if [[ ! -x "${HARNESS_SRC}/scripts/qemu/run_scheduler_tests.sh" ]]; then
            echo "::error::Missing executable script: ${HARNESS_SRC}/scripts/qemu/run_scheduler_tests.sh"
            exit 1
          fi

          mkdir -p "${RK0_ROOT}/tests"
          rm -rf "${RK0_ROOT}/tests/qemu"
          ln -s "${HARNESS_SRC}" "${RK0_ROOT}/tests/qemu"
          echo "RK0_QEMU_HARNESS=${HARNESS_SRC}" >> "${GITHUB_ENV}"
          ls -la "${RK0_ROOT}/tests"

      - name: Run QEMU unit tests
        env:
          ARCH: armv7m
          BUILD: DEBUG
          QEMU_TEST_TIMEOUT: 12
        run: |
          set -euo pipefail
          export RK0_ROOT="$(git -C "${GITHUB_WORKSPACE:-$PWD}" rev-parse --show-toplevel)"
          echo "RK0 root: ${RK0_ROOT}"
          git -C "${RK0_ROOT}" rev-parse --short HEAD
          UNIT_LOG="${RK0_ROOT}/unitests-${ARCH}.log"
          set +e
          "${RK0_QEMU_HARNESS}/scripts/qemu/run_unit_tests.sh" \
            kversion kmem kmrm ksema kmutex kscheduler \
            kmesgq krendezvous kchannel ktaskevents ksleepq ktimer \
            | tee "${UNIT_LOG}"
          test_rc=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^\[RK_UT\] (BUILD_FAIL|FAIL|TIMEOUT|NO_MARKER) module=' "${UNIT_LOG}"; then
            exit 1
          fi
          exit "${test_rc}"

      - name: Run scheduler conformance test
        env:
          ARCH: armv7m
          BUILD: DEBUG
          QEMU_TEST_TIMEOUT: 12
        run: |
          set -euo pipefail
          export RK0_ROOT="$(git -C "${GITHUB_WORKSPACE:-$PWD}" rev-parse --show-toplevel)"
          echo "RK0 root: ${RK0_ROOT}"
          git -C "${RK0_ROOT}" rev-parse --short HEAD
          "${RK0_QEMU_HARNESS}/scripts/qemu/run_scheduler_tests.sh"

      - name: Run QEMU unit tests (armv6m)
        env:
          ARCH: armv6m
          BUILD: DEBUG
          QEMU_TEST_TIMEOUT: 12
        run: |
          set -euo pipefail
          export RK0_ROOT="$(git -C "${GITHUB_WORKSPACE:-$PWD}" rev-parse --show-toplevel)"
          echo "RK0 root: ${RK0_ROOT}"
          git -C "${RK0_ROOT}" rev-parse --short HEAD
          UNIT_LOG="${RK0_ROOT}/unitests-${ARCH}.log"
          set +e
          "${RK0_QEMU_HARNESS}/scripts/qemu/run_unit_tests.sh" \
            kversion kmem kmrm ksema kmutex kscheduler \
            kmesgq krendezvous kchannel ktaskevents ksleepq ktimer \
            | tee "${UNIT_LOG}"
          test_rc=${PIPESTATUS[0]}
          set -e
          if grep -Eq '^\[RK_UT\] (BUILD_FAIL|FAIL|TIMEOUT|NO_MARKER) module=' "${UNIT_LOG}"; then
            exit 1
          fi
          exit "${test_rc}"

      - name: Run scheduler conformance test (armv6m)
        env:
          ARCH: armv6m
          BUILD: DEBUG
          QEMU_TEST_TIMEOUT: 12
        run: |
          set -euo pipefail
          export RK0_ROOT="$(git -C "${GITHUB_WORKSPACE:-$PWD}" rev-parse --show-toplevel)"
          echo "RK0 root: ${RK0_ROOT}"
          git -C "${RK0_ROOT}" rev-parse --short HEAD
          "${RK0_QEMU_HARNESS}/scripts/qemu/run_scheduler_tests.sh"

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs-armv7m-armv6m-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/**/qemu-tests/*.log
            test.log
            unitests*.log
